# SPDX-License-Identifier: CC0-1.0
name: Client

# The core's client layer against a real server: the server built from server/, started with TLS
# by core/test-with-server.sh, and the core's client test run against it on the JVM, on Android
# emulators and in the iOS simulator. A change on either side can break the other, so both start it.
on:
  # Branches are tested through their pull requests; pushes only on main.
  push:
    branches: [main]
    paths: ["core/**", "server/**", "spec/vectors/**", ".github/workflows/client.yml"]
  pull_request:
    paths: ["core/**", "server/**", "spec/vectors/**", ".github/workflows/client.yml"]

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # Gradle's downloads, kept from run to run so that a run asks Maven Central for little: it
      # turns busy runners away. Gradle checks every artifact against verification-metadata.xml
      # whether it was downloaded or kept, so a kept one can't change what a build uses.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-${{ hashFiles('**/gradle/verification-metadata.xml') }}
          restore-keys: gradle-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-

      - name: Gradle 9.9.1, checked against its published SHA-256
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-9.9.1-bin.zip
          echo "d8a18a7a841dd5df825d35a685fad6f2d7f12ac0c280e57b67c27b4a520ba228  $RUNNER_TEMP/gradle.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.9.1/bin" >> "$GITHUB_PATH"

      - name: Android platform 37.0 and build tools 36.0.0
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      # Every module is checked against go.sum, whose hashes the Go checksum database vouches for.
      - name: The server's modules
        working-directory: server
        run: |
          go mod download
          go mod verify

      # Every artifact is checked against gradle/verification-metadata.xml. Maven Central
      # sometimes answers 429, so a failed download is tried again after a pause; a hash
      # that doesn't match, or a test that fails, fails at once.
      - name: The core's tests on the JVM, against the server
        working-directory: core
        run: |
          log="$RUNNER_TEMP/client.log"
          for attempt in 1 2 3 4 5; do
            if ./test-with-server.sh --no-daemon --stacktrace > "$log" 2>&1; then
              cat "$log"
              break
            fi
            cat "$log"
            if grep -q -E "Dependency verification failed|There were failing tests|Compilation error|Kotlin compiler|didn't start|No setup code" "$log"; then exit 1; fi
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 60))
          done
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ran = 0
          for f in glob.glob("build/test-results/jvmTest/*ClientServerTest.xml"):
              t = ET.parse(f).getroot()
              ran += int(t.get("tests", 0)) - int(t.get("skipped", 0))
          print(f"{ran} tests against the server")
          raise SystemExit(0 if ran else 1)
          PY

  # The same test on Android, through OkHttp, in an emulator running stock Android: the oldest
  # version the core supports and a recent one.
  # The server runs on the runner, and adb forwards the emulator's 127.0.0.1:8443 to it.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # Gradle's downloads, kept from run to run so that a run asks Maven Central for little: it
      # turns busy runners away. Gradle checks every artifact against verification-metadata.xml
      # whether it was downloaded or kept, so a kept one can't change what a build uses.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-${{ hashFiles('**/gradle/verification-metadata.xml') }}
          restore-keys: gradle-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-

      - name: Gradle 9.9.1, checked against its published SHA-256
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-9.9.1-bin.zip
          echo "d8a18a7a841dd5df825d35a685fad6f2d7f12ac0c280e57b67c27b4a520ba228  $RUNNER_TEMP/gradle.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.9.1/bin" >> "$GITHUB_PATH"

      - name: The server's modules
        working-directory: server
        run: |
          go mod download
          go mod verify

      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # sdkmanager checks each package against the checksum in Google's repository index.
      - name: Android ${{ matrix.api }} emulator
        env:
          API: ${{ matrix.api }}
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          "$sdk/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-$API;default;x86_64" > /dev/null
          # avdmanager and the emulator look for AVDs in different places on the runner unless told one.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$sdk/avdmanager" create avd --force -n kinfold -k "system-images;android-$API;default;x86_64"
          adb="$ANDROID_HOME/platform-tools/adb"
          # Start adb first: it makes the key the emulator hands the device, so adb is let in.
          "$adb" start-server
          "$ANDROID_HOME/emulator/emulator" -avd kinfold -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator=$!
          for i in $(seq 1 120); do
            [ $((i % 12)) = 0 ] && "$adb" devices
            if ! kill -0 "$emulator" 2> /dev/null; then
              echo "The emulator stopped:"
              cat "$RUNNER_TEMP/emulator.log"
              exit 1
            fi
            if [ "$(timeout 10 "$adb" shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ]; then
              echo "Booted after about $((i * 5)) seconds"
              exit 0
            fi
            sleep 5
          done
          echo "The emulator didn't boot in 10 minutes:"
          cat "$RUNNER_TEMP/emulator.log"
          exit 1

      - name: The client layer on Android ${{ matrix.api }}, against the server
        working-directory: core
        env:
          KINFOLD_TEST_TASKS: connectedAndroidDeviceTest
        run: |
          "$ANDROID_HOME/platform-tools/adb" reverse tcp:8443 tcp:8443
          log="$RUNNER_TEMP/client.log"
          for attempt in 1 2 3 4 5; do
            if ./test-with-server.sh --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=ca.gureet.kinfold.core.ClientServerTest > "$log" 2>&1; then
              cat "$log"
              break
            fi
            cat "$log"
            # A failing test is reported below, with its message.
            if grep -q -E "There were failing tests|tests on .* failed" "$log"; then break; fi
            if grep -q -E "Dependency verification failed|Compilation error|Kotlin compiler|didn't start|No setup code" "$log"; then exit 1; fi
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 60))
          done
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ran = failed = 0
          for f in glob.glob("build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              for case in ET.parse(f).getroot().iter("testcase"):
                  if case.get("classname", "").endswith("ClientServerTest") and case.find("skipped") is None:
                      ran += 1
                      for problem in [case.find("failure"), case.find("error")]:
                          if problem is not None:
                              failed += 1
                              print(f"FAILED {case.get('name')}:\n{(problem.text or problem.get('message') or '')[:4000]}")
          print(f"{ran} tests against the server on the device, {failed} failed")
          raise SystemExit(1 if failed or not ran else 0)
          PY

  # The same test on iOS, through URLSession, in the iOS simulator. The simulator's processes run
  # on the Mac, so the test reaches the server on 127.0.0.1 directly.
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # Gradle's downloads, kept from run to run so that a run asks Maven Central for little: it
      # turns busy runners away. Gradle checks every artifact against verification-metadata.xml
      # whether it was downloaded or kept, so a kept one can't change what a build uses.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-${{ hashFiles('**/gradle/verification-metadata.xml') }}
          restore-keys: gradle-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-

      - name: Gradle 9.9.1, checked against its published SHA-256
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-9.9.1-bin.zip
          echo "d8a18a7a841dd5df825d35a685fad6f2d7f12ac0c280e57b67c27b4a520ba228  $RUNNER_TEMP/gradle.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.9.1/bin" >> "$GITHUB_PATH"

      - name: Kotlin/Native's LLVM and libffi, checked against pinned SHA-256s
        run: core/kotlin-native-deps.sh

      # The test certificate is made with OpenSSL's options; macOS's own openssl is LibreSSL.
      - name: OpenSSL from Homebrew
        run: |
          openssl=$(brew --prefix openssl@3)/bin
          "$openssl/openssl" version
          echo "$openssl" >> "$GITHUB_PATH"

      - name: The newest iOS simulator's first iPhone
        run: |
          device=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if ".iOS-" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[1].split("-")])
          for runtime in reversed(ios):
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"], runtime.rsplit(".", 1)[1], d["name"], file=sys.stderr)
                      print(d["udid"])
                      sys.exit()
          sys.exit("no iPhone simulator")
          ')
          echo "SIMULATOR=$device" >> "$GITHUB_ENV"

      # Every module is checked against go.sum, whose hashes the Go checksum database vouches for.
      - name: The server's modules
        working-directory: server
        run: |
          go mod download
          go mod verify

      # The test runs inside the booted simulator, whose own services check the server's certificate.
      - name: The client layer in the iOS simulator, against the server
        working-directory: core
        env:
          KINFOLD_TEST_TASKS: iosSimulatorArm64Test
        run: |
          xcrun simctl boot "$SIMULATOR" || true
          xcrun simctl bootstatus "$SIMULATOR" -b
          log="$RUNNER_TEMP/client.log"
          for attempt in 1 2 3 4 5; do
            if ./test-with-server.sh --no-daemon --stacktrace -Pkinfold.simulator="$SIMULATOR" -Pkinfold.simulator.booted=true --tests '*ClientServerTest*' > "$log" 2>&1; then
              cat "$log"
              break
            fi
            cat "$log"
            if grep -q -E "Dependency verification failed|There were failing tests|Compilation error|Kotlin compiler|didn't start|No setup code|^e: " "$log"; then exit 1; fi
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 60))
          done
          # Kotlin/Native can't mark a test skipped, so the test prints that it was.
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ran = 0
          for f in glob.glob("build/test-results/iosSimulatorArm64Test/*ClientServerTest.xml"):
              t = ET.parse(f).getroot()
              out = "".join(e.text or "" for e in t.iter("system-out"))
              if "skipped:" in out:
                  raise SystemExit("the test was skipped: " + out.strip()[:500])
              ran += int(t.get("tests", 0)) - int(t.get("failures", 0)) - int(t.get("errors", 0))
          print(f"{ran} tests against the server in the simulator")
          raise SystemExit(0 if ran else 1)
          PY

      - name: Why the client test failed
        if: failure()
        working-directory: core
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("build/test-results/iosSimulatorArm64Test/*.xml"):
              for case in ET.parse(f).getroot().iter("testcase"):
                  for problem in list(case.iter("failure")) + list(case.iter("error")):
                      print(f"FAILED {case.get('name')}: {problem.get('message')}\n{(problem.text or '')[:4000]}")
          PY
