# SPDX-License-Identifier: CC0-1.0
name: Platform crypto

on:
  # Branches are tested through their pull requests; pushes only on main.
  push:
    branches: [main]
    paths: ["spec/vectors/**", "reference/platforms/**", ".github/workflows/platforms.yml"]
  pull_request:
    paths: ["spec/vectors/**", "reference/platforms/**", ".github/workflows/platforms.yml"]

permissions:
  contents: read

jobs:
  ed25519-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # Gradle's downloads, kept from run to run so that a run asks Maven Central for little: it
      # turns busy runners away. Gradle checks every artifact against verification-metadata.xml
      # whether it was downloaded or kept, so a kept one can't change what a build uses.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-${{ hashFiles('**/gradle/verification-metadata.xml') }}
          restore-keys: gradle-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-

      - name: Gradle 9.9.1, checked against its published SHA-256
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-9.9.1-bin.zip
          echo "d8a18a7a841dd5df825d35a685fad6f2d7f12ac0c280e57b67c27b4a520ba228  $RUNNER_TEMP/gradle.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.9.1/bin" >> "$GITHUB_PATH"

      # Every artifact is checked against gradle/verification-metadata.xml. Maven Central
      # sometimes answers 429, so a failed download is tried again after a pause; a hash
      # that doesn't match fails at once.
      - name: Build the check
        working-directory: reference/platforms/jvm
        run: |
          log="$RUNNER_TEMP/gradle.log"
          for attempt in 1 2 3 4; do
            if gradle --no-daemon --console=plain installDist > "$log" 2>&1; then
              cat "$log"
              exit 0
            fi
            cat "$log"
            if grep -q "Dependency verification failed" "$log"; then exit 1; fi
            sleep $((attempt * 30))
          done
          exit 1

      - name: Ed25519 edge cases on the JDK, Tink, Conscrypt and Bouncy Castle
        run: reference/platforms/jvm/build/install/kinfold-ed25519-jvm/bin/kinfold-ed25519-jvm spec/vectors/kinfold-v0.json
