# SPDX-License-Identifier: CC0-1.0
name: Spikes

# The spikes' code (spikes/): what can be built and tested without a phone. The harness is tested
# against a server built from server/; spike 2's Android app is built and unit-tested, and runs in
# emulators against such a server and the harness. Both build the core from core/, so changes there
# and in server/ start this too.
on:
  # Branches are tested through their pull requests; pushes only on main.
  push:
    branches: [main]
    paths: ["spikes/**", "core/**", "server/**", ".github/workflows/spikes.yml"]
  pull_request:
    paths: ["spikes/**", "core/**", "server/**", ".github/workflows/spikes.yml"]

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # Gradle's downloads, kept from run to run so that a run asks Maven Central for little: it
      # turns busy runners away. Gradle checks every artifact against verification-metadata.xml
      # whether it was downloaded or kept, so a kept one can't change what a build uses.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-${{ hashFiles('**/gradle/verification-metadata.xml') }}
          restore-keys: gradle-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-

      - name: Gradle 9.9.1, checked against its published SHA-256
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-9.9.1-bin.zip
          echo "d8a18a7a841dd5df825d35a685fad6f2d7f12ac0c280e57b67c27b4a520ba228  $RUNNER_TEMP/gradle.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.9.1/bin" >> "$GITHUB_PATH"

      # The core, built from source, configures its Android target.
      - name: Android platform 37.0 and build tools 36.0.0
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: The server's modules
        working-directory: server
        run: |
          go mod download
          go mod verify

      # Every artifact is checked against spikes/gradle/verification-metadata.xml. Maven Central
      # sometimes answers 429, so a failed download is tried again after a pause; a hash that
      # doesn't match, or a test that fails, fails at once.
      - name: The harness, tested against the server, and its distribution
        working-directory: core
        env:
          KINFOLD_TEST_DIR: ../spikes
          KINFOLD_TEST_TASKS: ":harness:test :harness:installDist"
        run: |
          log="$RUNNER_TEMP/harness.log"
          for attempt in 1 2 3 4 5; do
            if ./test-with-server.sh --no-daemon --stacktrace > "$log" 2>&1; then
              cat "$log"
              break
            fi
            cat "$log"
            if grep -q -E "Dependency verification failed|There were failing tests|Compilation error|Kotlin compiler|didn't start|No setup code" "$log"; then exit 1; fi
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 60))
          done
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ran = 0
          for f in glob.glob("../spikes/harness/build/test-results/test/*.xml"):
              t = ET.parse(f).getroot()
              ran += int(t.get("tests", 0)) - int(t.get("skipped", 0))
          print(f"{ran} harness tests against the server")
          raise SystemExit(0 if ran else 1)
          PY
          test -x ../spikes/harness/build/install/kinfold-harness/bin/kinfold-harness

      # The build that goes on the phones: no test certificate in it.
      - name: Spike 2's app, its unit tests and its APK
        working-directory: spikes
        run: |
          log="$RUNNER_TEMP/app.log"
          for attempt in 1 2 3 4 5; do
            if gradle --no-daemon --console=plain :android:testDebugUnitTest :android:assembleRelease > "$log" 2>&1; then
              cat "$log"
              break
            fi
            cat "$log"
            if grep -q -E "Dependency verification failed|There were failing tests|Compilation error|Kotlin compiler|Lint found" "$log"; then exit 1; fi
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 60))
          done
          ls -l android/build/outputs/apk/release/android-release.apk

  # Spike 2's app in an emulator, against a server and the harness (android/emulator-test.sh): the
  # oldest Android the core supports, and a recent one.
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # Gradle's downloads, kept from run to run so that a run asks Maven Central for little: it
      # turns busy runners away. Gradle checks every artifact against verification-metadata.xml
      # whether it was downloaded or kept, so a kept one can't change what a build uses.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-${{ hashFiles('**/gradle/verification-metadata.xml') }}
          restore-keys: gradle-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-

      - name: Gradle 9.9.1, checked against its published SHA-256
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-9.9.1-bin.zip
          echo "d8a18a7a841dd5df825d35a685fad6f2d7f12ac0c280e57b67c27b4a520ba228  $RUNNER_TEMP/gradle.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.9.1/bin" >> "$GITHUB_PATH"

      - name: The server's modules
        working-directory: server
        run: |
          go mod download
          go mod verify

      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # sdkmanager checks each package against the checksum in Google's repository index.
      - name: Android ${{ matrix.api }} emulator
        env:
          API: ${{ matrix.api }}
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          "$sdk/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-$API;default;x86_64" > /dev/null
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # avdmanager and the emulator look for AVDs in different places on the runner unless told one.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$sdk/avdmanager" create avd --force -n kinfold -k "system-images;android-$API;default;x86_64"
          adb="$ANDROID_HOME/platform-tools/adb"
          # Start adb first: it makes the key the emulator hands the device, so adb is let in.
          "$adb" start-server
          "$ANDROID_HOME/emulator/emulator" -avd kinfold -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator=$!
          for i in $(seq 1 120); do
            [ $((i % 12)) = 0 ] && "$adb" devices
            if ! kill -0 "$emulator" 2> /dev/null; then
              echo "The emulator stopped:"
              cat "$RUNNER_TEMP/emulator.log"
              exit 1
            fi
            if [ "$(timeout 10 "$adb" shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ]; then
              echo "Booted after about $((i * 5)) seconds"
              exit 0
            fi
            sleep 5
          done
          echo "The emulator didn't boot in 10 minutes:"
          cat "$RUNNER_TEMP/emulator.log"
          exit 1

      # Every artifact is checked against spikes/gradle/verification-metadata.xml. The build runs
      # first on its own, because Maven Central sometimes answers 429: a failed download is tried
      # again after a pause, and a hash that doesn't match fails at once. The test then runs once.
      - name: Spike 2's app on Android ${{ matrix.api }}, against a server and the harness
        working-directory: spikes
        env:
          KINFOLD_TEST_DIR: .
          KINFOLD_TEST_CMD: android/emulator-test.sh
        run: |
          log="$RUNNER_TEMP/build.log"
          for attempt in 1 2 3 4 5; do
            if gradle --no-daemon --console=plain :android:assembleRelease :harness:installDist > "$log" 2>&1; then break; fi
            cat "$log"
            if grep -q -E "Dependency verification failed|Compilation error|Kotlin compiler|Lint found" "$log"; then exit 1; fi
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 60))
          done
          adb reverse tcp:8443 tcp:8443
          ../core/test-with-server.sh --no-daemon
