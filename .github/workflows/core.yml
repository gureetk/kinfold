# SPDX-License-Identifier: CC0-1.0
name: Core

on:
  # Branches are tested through their pull requests; pushes only on main.
  push:
    branches: [main]
    paths: ["core/**", "spec/vectors/**", "spec/PROTOCOL.md", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", "spec/vectors/**", "spec/PROTOCOL.md", ".github/workflows/core.yml"]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # Gradle's downloads, kept from run to run so that a run asks Maven Central for little: it
      # turns busy runners away. Gradle checks every artifact against verification-metadata.xml
      # whether it was downloaded or kept, so a kept one can't change what a build uses.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-${{ hashFiles('**/gradle/verification-metadata.xml') }}
          restore-keys: gradle-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-

      - name: Gradle 9.9.1, checked against its published SHA-256
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-9.9.1-bin.zip
          echo "d8a18a7a841dd5df825d35a685fad6f2d7f12ac0c280e57b67c27b4a520ba228  $RUNNER_TEMP/gradle.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.9.1/bin" >> "$GITHUB_PATH"

      - name: Android platform 37.0 and build tools 36.0.0
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      # Every artifact is checked against gradle/verification-metadata.xml. Maven Central
      # sometimes answers 429, so a failed download is tried again after a pause; a hash
      # that doesn't match fails at once.
      - name: The vectors on the JVM, and on Android's host tests
        working-directory: core
        run: |
          log="$RUNNER_TEMP/gradle.log"
          for attempt in 1 2 3 4; do
            if gradle --no-daemon --console=plain check > "$log" 2>&1; then
              cat "$log"
              exit 0
            fi
            cat "$log"
            if grep -q -E "Dependency verification failed|There were failing tests|Compilation error|Kotlin compiler" "$log"; then exit 1; fi
            sleep $((attempt * 30))
          done
          exit 1

  # The same tests on Android itself, in an emulator running stock Android (no Google
  # services): the oldest version the core supports and the newest.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # Gradle's downloads, kept from run to run so that a run asks Maven Central for little: it
      # turns busy runners away. Gradle checks every artifact against verification-metadata.xml
      # whether it was downloaded or kept, so a kept one can't change what a build uses.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-${{ hashFiles('**/gradle/verification-metadata.xml') }}
          restore-keys: gradle-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-

      - name: Gradle 9.9.1, checked against its published SHA-256
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-9.9.1-bin.zip
          echo "d8a18a7a841dd5df825d35a685fad6f2d7f12ac0c280e57b67c27b4a520ba228  $RUNNER_TEMP/gradle.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.9.1/bin" >> "$GITHUB_PATH"

      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # sdkmanager checks each package against the checksum in Google's repository index.
      - name: Android ${{ matrix.api }} emulator
        env:
          API: ${{ matrix.api }}
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          "$sdk/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-$API;default;x86_64" > /dev/null
          # avdmanager and the emulator look for AVDs in different places on the runner unless told one.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$sdk/avdmanager" create avd --force -n kinfold -k "system-images;android-$API;default;x86_64"
          adb="$ANDROID_HOME/platform-tools/adb"
          # Start adb first: it makes the key the emulator hands the device, so adb is let in.
          "$adb" start-server
          "$ANDROID_HOME/emulator/emulator" -avd kinfold -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator=$!
          for i in $(seq 1 120); do
            [ $((i % 12)) = 0 ] && "$adb" devices
            if ! kill -0 "$emulator" 2> /dev/null; then
              echo "The emulator stopped:"
              cat "$RUNNER_TEMP/emulator.log"
              exit 1
            fi
            if [ "$(timeout 10 "$adb" shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ]; then
              echo "Booted after about $((i * 5)) seconds"
              exit 0
            fi
            sleep 5
          done
          echo "The emulator didn't boot in 10 minutes:"
          cat "$RUNNER_TEMP/emulator.log"
          exit 1

      - name: The vectors on Android ${{ matrix.api }}
        working-directory: core
        run: |
          log="$RUNNER_TEMP/gradle.log"
          for attempt in 1 2 3 4; do
            if gradle --no-daemon --console=plain connectedAndroidDeviceTest > "$log" 2>&1; then
              cat "$log"
              break
            fi
            cat "$log"
            if grep -q -E "Dependency verification failed|There were failing tests|Compilation error|Kotlin compiler|tests on .* failed" "$log"; then exit 1; fi
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 30))
          done
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests = failed = 0
          for f in glob.glob("build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              t = ET.parse(f).getroot()
              tests += int(t.get("tests", 0))
              failed += int(t.get("failures", 0)) + int(t.get("errors", 0))
          print(f"{tests} tests on the device, {failed} failed")
          raise SystemExit(1 if failed or not tests else 0)
          PY

  # The same tests on iOS, against CryptoKit in the simulator, and the build for iPhones.
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # Gradle's downloads, kept from run to run so that a run asks Maven Central for little: it
      # turns busy runners away. Gradle checks every artifact against verification-metadata.xml
      # whether it was downloaded or kept, so a kept one can't change what a build uses.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-${{ hashFiles('**/gradle/verification-metadata.xml') }}
          restore-keys: gradle-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-

      - name: Gradle 9.9.1, checked against its published SHA-256
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-9.9.1-bin.zip
          echo "d8a18a7a841dd5df825d35a685fad6f2d7f12ac0c280e57b67c27b4a520ba228  $RUNNER_TEMP/gradle.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.9.1/bin" >> "$GITHUB_PATH"

      # Kotlin/Native downloads its own LLVM and libffi and checks no hash, and JetBrains
      # publishes none. So they are fetched here and checked against the SHA-256s below, which
      # two runners agreed on, and Kotlin/Native finds them in its cache instead.
      - name: Kotlin/Native's LLVM and libffi, checked against pinned SHA-256s
        run: |
          cache="$HOME/.konan/dependencies/cache"
          mkdir -p "$cache"
          fetch() {
            file="$cache/$(basename "$2")"
            curl -fsSL -o "$file" "https://download.jetbrains.com/kotlin/native/$2"
            echo "$1  $file" | shasum -a 256 -c
          }
          fetch 62fd78f090353aa7b2c6601ad6f95bd7a0b0558b18f86978043cc878321b408a resources/llvm/21-aarch64-macos/llvm-21-aarch64-macos-essentials-97.tar.gz
          fetch 8ca0102ad5b626e8b1699f311ab098354a90154ea3e44951f28ebdd256862ba9 libffi-3.3-1-macos-arm64.tar.gz

      - name: Xcode and the simulator
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available
          # The newest iOS runtime's first iPhone
          device=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if ".iOS-" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[1].split("-")])
          for runtime in reversed(ios):
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"], runtime.rsplit(".", 1)[1], d["name"], file=sys.stderr)
                      print(d["udid"])
                      sys.exit()
          sys.exit("no iPhone simulator")
          ')
          echo "SIMULATOR=$device" >> "$GITHUB_ENV"

      - name: The vectors on the iOS simulator, and the test binary for iPhones
        working-directory: core
        run: |
          log="$RUNNER_TEMP/gradle.log"
          for attempt in 1 2 3 4; do
            if gradle --no-daemon --console=plain iosSimulatorArm64Test linkDebugTestIosArm64 -Pkinfold.simulator="$SIMULATOR" > "$log" 2>&1; then
              cat "$log" | tee -a "$RUNNER_TEMP/all.log"
              break
            fi
            cat "$log" | tee -a "$RUNNER_TEMP/all.log"
            # Only a failed download is worth another try; Maven Central sometimes answers 429.
            if ! grep -q -E "Could not (GET|HEAD|download|resolve)|Read timed out|429" "$log"; then exit 1; fi
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 30))
          done
          python3 - <<'PY2'
          import glob, xml.etree.ElementTree as ET
          tests = failed = 0
          for f in glob.glob("build/test-results/iosSimulatorArm64Test/*.xml"):
              t = ET.parse(f).getroot()
              tests += int(t.get("tests", 0))
              failed += int(t.get("failures", 0)) + int(t.get("errors", 0))
          print(f"{tests} tests in the simulator, {failed} failed")
          raise SystemExit(1 if failed or not tests else 0)
          PY2

      - name: Kotlin/Native downloaded nothing itself
        run: |
          if grep "Downloading dependency " "$RUNNER_TEMP/all.log"; then
            echo "Kotlin/Native downloaded the above, which no hash checked"
            exit 1
          fi

