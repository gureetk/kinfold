# Machine-readable license map (https://reuse.software). Files with their own
# SPDX-License-Identifier header keep it; these annotations cover the rest.
version = 1

[[annotations]]
path = ["README.md", "SECURITY.md", "CONTRIBUTING.md", "TRADEMARK.md", "CLAUDE.md", "spec/*.md", "spec/vectors/README.md"]
SPDX-FileCopyrightText = "Kinfold contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["spec/vectors/*.json", ".github/**", ".claude/**", ".gitignore", "REUSE.toml"]
SPDX-FileCopyrightText = "Kinfold contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["reference/**"]
SPDX-FileCopyrightText = "Kinfold contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["server/**"]
SPDX-FileCopyrightText = "Kinfold contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["apps/**", "core/**", "spikes/**"]
SPDX-FileCopyrightText = "Kinfold contributors"
SPDX-License-Identifier = "GPL-3.0-or-later WITH LicenseRef-Kinfold-AppStore-Exception"

# The map files (apps/maps/README.md). Later annotations take precedence over the one for apps/**.
[[annotations]]
path = ["apps/maps/assets/style.json"]
SPDX-FileCopyrightText = "Kinfold contributors"
SPDX-License-Identifier = "CC0-1.0"

# Made from Natural Earth, which is in the public domain.
[[annotations]]
path = ["apps/maps/assets/world.pmtiles"]
SPDX-FileCopyrightText = "Kinfold contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["apps/maps/assets/glyphs/**"]
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts)"
SPDX-License-Identifier = "OFL-1.1"
